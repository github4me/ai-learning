name: Deploy course to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-course-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install dependencies for Linux
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Validate content and build Node server
        run: pnpm build
      - name: Prepare deployment package
        run: |
          mkdir azure-package
          cp -R dist public node_modules azure-package/
          cp package.json azure-package/
      - name: Check packaged production server
        working-directory: azure-package
        env:
          NODE_ENV: production
          PORT: '8080'
        run: |
          npm start > ../production-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat ../production-start.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/week/week-06 > /dev/null
          curl --fail --silent http://127.0.0.1:8080/downloads/course-examples.zip > /dev/null
      - name: Archive only deployable files
        working-directory: azure-package
        run: zip -q -r ../azure-course.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: azure-course
          path: azure-course.zip
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-course
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Node application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: azure-course.zip
          startup-command: npm start
