name: Deploy course to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-course-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install dependencies for Linux
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Validate content and build Node server
        run: pnpm build
      - name: Prepare deployment package
        # Outside the checkout: missing dependencies must not resolve from its parent.
        run: node scripts/prepare-azure-package.mjs "$RUNNER_TEMP/azure-course"
      - name: Check packaged production server
        working-directory: ${{ runner.temp }}/azure-course
        env:
          NODE_ENV: production
          PORT: '8080'
          HOST: '127.0.0.1'
        run: |
          node server.js > "$RUNNER_TEMP/production-start.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/production-start.log"
              exit 1
            fi
            if curl --fail --silent --max-time 5 http://127.0.0.1:8080/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/production-start.log"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8080/week/week-06 > /dev/null
          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8080/downloads/course-examples.zip > /dev/null
      - name: Preserve production startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-start-log
          path: ${{ runner.temp }}/production-start.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive only deployable files
        working-directory: ${{ runner.temp }}/azure-course
        run: |
          zip -q -r "$RUNNER_TEMP/azure-course.zip" .
          zip_bytes=$(stat -c%s "$RUNNER_TEMP/azure-course.zip")
          echo "Deployment ZIP: $zip_bytes bytes"
          echo "Deployment ZIP: $zip_bytes bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: azure-course
          path: ${{ runner.temp }}/azure-course.zip
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-course
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Node application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: azure-course.zip
          startup-command: cd /home/site/wwwroot && node server.js
